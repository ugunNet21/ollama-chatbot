<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot dengan Ollama</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-robot"></i> Ollama Chat</h2>
            </div>
            <div class="model-section">
                <h3>Model AI</h3>
                <div class="model-list" id="modelList">
                    <!-- Model akan diisi secara dinamis -->
                </div>
            </div>
            <div class="model-info" id="modelInfo">
                <h4>Info Model</h4>
                <p id="modelDetails">Pilih model untuk melihat detail</p>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="model-selector">
                    <i class="fas fa-brain"></i>
                    <span id="currentModel">gemma3:1b</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="chat-actions">
                    <button id="clearChat" title="Hapus Chat">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button id="newChat" title="Chat Baru">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        <div class="message-avatar">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="message-text">
                            Halo! Saya adalah asisten AI. Ada yang bisa saya bantu?
                        </div>
                    </div>
                    <div class="message-time">Baru saja</div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Ketik pesan Anda..." rows="1"></textarea>
                    <button id="sendButton" class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="model-info-mobile">
                    <i class="fas fa-brain"></i>
                    <span id="currentModelMobile">gemma3:1b</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
