<!--public/index.html-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot dengan Ollama</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Login to Chat</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usernameInput">Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter your username" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-robot"></i> Ollama Chat</h2>
                <div class="user-info">
                    <span id="currentUser"></span>
                    <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            
            <div class="chat-history-section">
                <h3>Chat History</h3>
                <div class="chat-history-list" id="chatHistoryList"></div>
            </div>
            
            <div class="model-section">
                <h3>Model AI</h3>
                <div class="model-list" id="modelList"></div>
            </div>
            
            <div class="model-info" id="modelInfo">
                <h4>Info Model</h4>
                <p id="modelDetails">Pilih model untuk melihat detail</p>
            </div>
        </div>
        
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-title" id="chatTitle">New Chat</div>
                <div class="model-selector">
                    <i class="fas fa-brain"></i>
                    <span id="currentModel">gemma3:1b</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="chat-actions">
                    <button id="clearChat" title="Hapus Chat">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button id="newChat" title="Chat Baru">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be loaded here -->
            </div>
            
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input type="file" id="fileInput" style="display: none;" accept=".txt,.md,.csv,.json,.xml,.jpg,.jpeg,.png,.gif,.webp,.js,.ts,.jsx,.tsx,.py,.java,.php,.cpp,.c,.rb,.go,.rs">
                    <button id="fileButton" class="file-button" title="Upload File">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea id="messageInput" placeholder="Ketik pesan atau upload file..." rows="1"></textarea>
                    <button id="sendButton" class="send-button" title="Kirim">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="model-info-mobile">
                    <i class="fas fa-brain"></i>
                    <span id="currentModelMobile">gemma3:1b</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
